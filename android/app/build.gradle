plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.playimdb.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.playimdb.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            // Points to your local Vite dev server — update IP to match your machine
            // Run: npm run dev -- --host   to expose on your network
            buildConfigField "String", "SITE_URL", '"http://192.168.1.100:5173/"'
        }
        release {
            buildConfigField "String", "SITE_URL", '"https://imdfree.netlify.app/"'
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.leanback:leanback:1.0.0'
}
